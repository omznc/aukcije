name: deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by scrape.yml. A push made with GITHUB_TOKEN — which is how the
  # scraper commits data/ — deliberately does not trigger `on: push`, so the
  # refreshed dataset would otherwise sit in the repo and never reach the site.
  workflow_call:

# One deploy at a time; an older build finishing late must not overwrite a newer
# one. Superseded runs are cancelled rather than queued.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Explicitly the branch tip, not the commit that triggered the run.
      # actions/checkout defaults to github.sha, and when scrape.yml calls this
      # workflow that SHA is the commit from *before* the scraper committed the
      # refreshed data — so the deploy would rebuild the previous dataset and
      # report success. It did exactly that on the first scheduled run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Node 24: the build runs .ts files directly (scripts/verify-build.ts) and
      # relies on native type stripping. This is also why the site is built here
      # rather than by Cloudflare Pages' own build image.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Share cards are ~130 ms each and there is one per notice, so a cold
      # build spends six minutes redrawing an archive that has not changed.
      # Each card is keyed by what is printed on it, so this restores every
      # settled listing and only the handful whose countdown moved get redrawn.
      # Losing the cache costs time and nothing else.
      - name: Restore share-card cache
        uses: actions/cache@v4
        with:
          path: .cache/og
          key: og-${{ github.run_id }}
          restore-keys: og-

      # What is actually about to be published. A deploy that silently rebuilt
      # stale data looks identical to a good one without this.
      - name: Show what is being deployed
        run: |
          echo "commit:      $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"
          echo "generatedAt: $(node -p "require('./data/listings.json').generatedAt")"
          echo "listings:    $(node -p "require('./data/listings.json').count")"

      - run: npm test
      - run: npm run typecheck

      # Ends in scripts/verify-build.ts, which fails the job if any route did
      # not generate. Nothing is uploaded unless that passes.
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sudske-prodaje --branch=main
